[project]
name = "release-notes"
version = "0.1.0"
description = "Internal tool to record and list what shipped in each release"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
