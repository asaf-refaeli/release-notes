[project]
name = "release-notes"
version = "0.1.1"
description = "Internal tool to record and list what shipped in each release"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.0",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-json-logger>=4.2.0",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "small: one process, no network, no files, no database (Google test sizes)",
    "medium: one machine: localhost network, files, or a real Postgres via testcontainers",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "FAST", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
