[project]
name = "release-notes"
version = "0.1.0"
description = "Internal tool to record and list what shipped in each release"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.6",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "FAST", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
