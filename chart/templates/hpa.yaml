{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "release-notes.fullname" . }}
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  annotations:
    # After the Deployment (wave 1). The HPA reads its target's scale; with the target missing,
    # Argo CD reports the HPA Degraded, the wave fails, and the Deployment is never created.
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "release-notes.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
