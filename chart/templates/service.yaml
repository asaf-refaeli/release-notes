apiVersion: v1
kind: Service
metadata:
  name: {{ include "release-notes.fullname" . }}
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "release-notes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
