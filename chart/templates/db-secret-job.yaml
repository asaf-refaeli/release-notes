{{- if .Values.database.createSecret.enabled }}
{{- /*
Creates the database password Secret inside the cluster if it is missing (ADR-0011).
Argo CD runs everything here as PreSync hooks, before the Sync phase starts Postgres (wave -1):
the RBAC first (hook wave -1), then the Job (hook wave 0). The Secret itself is created by the
Job, not rendered here, so Argo CD never tracks, diffs or prunes it, and the password never
appears in Git or in a rendered manifest.
*/}}
{{- $name := printf "%s-db-secret" (include "release-notes.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Read only this one Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.database.existingSecret | quote }}]
    verbs: ["get"]
  # Kubernetes cannot limit "create" to a name (the object does not exist when the request is
  # checked), so this allows creating any Secret in this namespace, and nothing else.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-secret
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: db-secret
  annotations:
    # Runs on every sync; after the first one it finds the Secret and does nothing.
    # BeforeHookCreation keeps the last run for its logs (same as the migration Job).
    # A plain helm install ignores these annotations: the Job then starts together with Postgres,
    # which waits in CreateContainerConfigError until the Secret exists, then starts.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Retries cover the RBAC not being active yet when the first pod starts.
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "release-notes.labels" . | nindent 8 }}
        app.kubernetes.io/component: db-secret
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      # The only pod in the chart that calls the Kubernetes API, so the only one with a token.
      automountServiceAccountToken: true
      # Same non-root, Pod Security "restricted" settings as the app; kubectl needs no fixed UID.
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: create-secret
          image: "{{ .Values.database.createSecret.image.repository }}:{{ .Values.database.createSecret.image.tag }}@{{ .Values.database.createSecret.image.digest }}"
          # Replaces the image's kubectl entrypoint with a shell, for the "only if missing" logic.
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              if kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" >/dev/null 2>&1; then
                echo "Secret $SECRET_NAME exists, keeping it (Postgres already uses this password)."
              else
                # 16 random bytes as 32 hex characters: letters and digits only, safe inside DATABASE_URL.
                password="$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')"
                kubectl -n "$NAMESPACE" create secret generic "$SECRET_NAME" \
                  --from-literal="$SECRET_KEY=$password"
                echo "Secret $SECRET_NAME created."
              fi
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: {{ .Values.database.existingSecret | quote }}
            - name: SECRET_KEY
              value: {{ .Values.database.passwordKey | quote }}
            # kubectl writes its API discovery cache under $HOME; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.database.createSecret.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
