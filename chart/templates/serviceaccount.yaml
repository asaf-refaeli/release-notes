apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "release-notes.fullname" . }}
  labels:
    {{- include "release-notes.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app never calls the Kubernetes API, so its pods get no API token.
automountServiceAccountToken: false
