name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skipped on the release PR and release commit: they only change versions and changelogs,
  # and the release tags the parent's image, already built and tested
  lint:
    if: >-
      github.head_ref != 'release-please--branches--main'
      && !startsWith(github.event.head_commit.message, 'chore: release main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          enable-cache: true

      # --locked fails if uv.lock no longer matches pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      # Runs even when an earlier check failed, so every problem shows in one run
      - name: Ruff format check
        if: success() || failure()
        run: uv run ruff format --check .

      # Standalone binary: no Node needed. biome.json limits it to app/static
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        if: success() || failure()
        with:
          version: "2.6.7"

      # Lint + format check for the UI's JS and CSS; fails on errors, prints warnings
      - name: Biome
        if: success() || failure()
        run: biome ci

  test:
    if: >-
      github.head_ref != 'release-please--branches--main'
      && !startsWith(github.event.head_commit.message, 'chore: release main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # testcontainers starts a real Postgres through the runner's Docker
      - name: Run tests
        run: uv run pytest

  sast:
    if: >-
      github.head_ref != 'release-please--branches--main'
      && !startsWith(github.event.head_commit.message, 'chore: release main')
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --error fails the job on any finding; --severity ERROR limits findings to the highest-severity rules
      - name: Semgrep scan
        run: >-
          semgrep scan --config p/python --config p/javascript --config p/fastapi
          --severity ERROR --error --metrics=off
          --sarif-output=semgrep.sarif

      # Runs even when the scan fails, so findings still reach the Security tab and the PR
      - name: Upload results to Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif

  helm:
    runs-on: ubuntu-latest
    container: quay.io/helmpack/chart-testing:v3.15.0@sha256:54317f2d93730ea9ca1236e3d79cd95d74110b8d733b6ab124e5829209b5f4e4
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    defaults:
      run:
        shell: bash
    steps:
      # Full history so ct can diff against main to find changed charts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The container runs as a different user than the checkout owner; git refuses such repos by default
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Lints changed charts with each chart/ci/*-values.yaml. Version bump check off: release-please bumps the chart
      - name: Chart lint (ct)
        run: ct lint --chart-dirs . --target-branch main --validate-maintainers=false --check-version-increment=false

      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz -C /usr/local/bin kubeconform

      # Second schema location covers CRDs such as ServiceMonitor and HTTPRoute
      - name: Validate rendered manifests (kubeconform)
        run: |
          for f in chart/ci/*-values.yaml; do
            echo "== $f"
            helm template ci chart -f "$f" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  # Builds and tests the image. Runs PR code (smoke test), so it gets no packages: write;
  # the push is a separate main-only job.
  image:
    needs: [lint, test, sast]
    if: >-
      github.head_ref != 'release-please--branches--main'
      && !startsWith(github.event.head_commit.message, 'chore: release main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: localhost/release-notes:${{ github.sha }}
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The source label links the GHCR package to this repo
      - name: Build image (Buildah)
        run: >-
          buildah build
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          -t "$IMAGE" .

      - name: Smoke test
        run: scripts/smoke-test.sh "$IMAGE"

      # Trivy reads the saved file, so no container engine socket is needed
      - name: Save image
        run: |
          podman save -o image.tar "$IMAGE"
          mkdir -p "$HOME/.cache/trivy"

      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: >-
          podman run --rm
          -v "$PWD:/work" -v "$HOME/.cache/trivy:/root/.cache/trivy"
          "$TRIVY_IMAGE" image --input /work/image.tar
          --severity HIGH,CRITICAL --exit-code 1

      # Runs even when the scan fails, so findings still reach the Security tab; reuses the cached DB
      - name: Trivy SARIF report
        if: success() || failure()
        run: >-
          podman run --rm
          -v "$PWD:/work" -v "$HOME/.cache/trivy:/root/.cache/trivy"
          "$TRIVY_IMAGE" image --input /work/image.tar
          --severity HIGH,CRITICAL --format sarif --output /work/trivy.sarif

      - name: Upload results to Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Hands the tested image to the push job; only main pushes
      - name: Upload image for the push job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar
          retention-days: 1

  # The only job with packages: write. Main only, no checkout: it runs no repository code,
  # so code from a PR never runs where the push token exists.
  push:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: image

      # Writes ~/.docker/config.json, which skopeo reads
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the same image that was tested; the digest is what deployments pin
      - name: Push to GHCR
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          skopeo copy --digestfile digest.txt docker-archive:image.tar "docker://$repo:$tag"
          echo "Pushed $repo:$tag@$(cat digest.txt)"

  # Opens or updates the release PR on each merge; when the release PR merges, creates the tags and GitHub Releases.
  # Runs only after every gate passed, so the release PR only lists commits whose image is in GHCR.
  release:
    # Skipped is allowed (the release commit skips the gates), so every gate is listed to catch a failure
    needs: [lint, test, sast, helm, image, push]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two quick merges must not update the release PR at the same time
    concurrency: release-please
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: write
    # Empty unless that package was released in this run
    outputs:
      app_version: ${{ steps.release.outputs.version }}
      image_digest: ${{ steps.tag.outputs.digest }}
      chart_version: ${{ steps.release.outputs['chart--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

      # release-please bumps pyproject.toml but has no uv.lock updater, so the next PR's `uv sync --locked`
      # would fail. Re-lock on the release PR branch so the version bump lands in both files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.release.outputs.pr
        with:
          version: "0.12.7"

      - name: Update uv.lock on the release PR
        if: steps.release.outputs.pr
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: update uv.lock"
          git push

      # Writes ~/.docker/config.json; skopeo reads it, and helm push through --registry-config
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.release.outputs.releases_created == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Adds the version tag to the parent commit's image, built and tested when it merged:
      # same manifest, same digest, no rebuild
      - name: Tag the image with the version
        id: tag
        if: steps.release.outputs.release_created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          # main before this push; with squash merge, the release commit's parent
          PARENT_SHA: ${{ github.event.before }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          skopeo copy --preserve-digests "docker://$repo:sha-${PARENT_SHA::7}" "docker://$repo:$VERSION"
          echo "digest=$(skopeo inspect --format '{{.Digest}}' "docker://$repo:$VERSION")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs['chart--release_created'] == 'true'
        with:
          persist-credentials: false

      # Publishes the released chart as an OCI artifact; the GitOps repo pins this version
      - name: Push the chart to GHCR
        if: steps.release.outputs['chart--release_created'] == 'true'
        run: |
          helm package chart --destination dist
          helm push dist/*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" \
            --registry-config "$HOME/.docker/config.json"

  # Commits the released versions to kind-gitops; Argo CD deploys from there. That commit is the deploy; reverting it is the rollback.
  update-gitops:
    needs: [release]
    # Without a status function GitHub adds success(), which also requires the jobs before release; those are skipped on a release commit
    if: >-
      !cancelled() && needs.release.result == 'success'
      && (needs.release.outputs.app_version != '' || needs.release.outputs.chart_version != '')
    runs-on: ubuntu-latest
    # Serializes pushes to kind-gitops across runs
    concurrency: kind-gitops
    # GITHUB_TOKEN is not used; access to kind-gitops comes from the GitHub App token
    permissions: {}
    steps:
      # Short-lived token for the App, which is installed on kind-gitops only
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          repositories: kind-gitops

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/kind-gitops
          token: ${{ steps.token.outputs.token }}

      # Quoted version so a version like 1.10 is never read as a number
      - name: Update pins
        env:
          APP_VERSION: ${{ needs.release.outputs.app_version }}
          IMAGE_DIGEST: ${{ needs.release.outputs.image_digest }}
          CHART_VERSION: ${{ needs.release.outputs.chart_version }}
        run: |
          if [ -n "$APP_VERSION" ]; then
            for env in dev prod; do
              yq -i '.image.tag = strenv(APP_VERSION) | .image.tag style="double" | .image.digest = strenv(IMAGE_DIGEST)' workloads/apps/release-notes/values-$env.yaml
            done
          fi
          if [ -n "$CHART_VERSION" ]; then
            for env in dev prod; do
              yq -i '(.spec.sources[] | select(.chart == "release-notes") | .targetRevision) = strenv(CHART_VERSION) | (.spec.sources[] | select(.chart == "release-notes") | .targetRevision) style="double"' bootstrap/apps/release-notes-$env.yaml
            done
          fi

      # One commit for all pins, so they deploy and revert together
      - name: Commit and push
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          APP_VERSION: ${{ needs.release.outputs.app_version }}
          CHART_VERSION: ${{ needs.release.outputs.chart_version }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          # Only the files this job edits: the App token can push, so nothing else gets staged
          git add workloads/apps/release-notes/values-dev.yaml workloads/apps/release-notes/values-prod.yaml \
            bootstrap/apps/release-notes-dev.yaml bootstrap/apps/release-notes-prod.yaml
          if git diff --cached --quiet; then
            echo "Pins already up to date"
            exit 0
          fi
          git commit -m "chore(release-notes): deploy app ${APP_VERSION:-unchanged}, chart ${CHART_VERSION:-unchanged}" \
            -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git pull --rebase
          git push
